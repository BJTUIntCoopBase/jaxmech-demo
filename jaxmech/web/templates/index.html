<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jaxmech demo</title>
  <meta name="description" content="jaxmech demo computational mechanics frontend" />
  <link rel="stylesheet" href="/static/css/main.css?v=8" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">JM</div>
          <span class="logo-text">jaxmech</span>
          <span class="logo-version">demo</span>
        </div>
        <div class="active-model-card" onclick="App.navigate('models')" title="选择工作模型">
          <div class="active-model-label">当前工作模型</div>
          <div id="sidebar-active-model" class="active-model-name">未选择</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">概览</div>
          <div class="nav-item active" data-page="dashboard"><span class="nav-icon">JM</span><span>仪表板</span></div>
          <div class="nav-item" data-page="models"><span class="nav-icon">MD</span><span>模型浏览</span></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">分析模块</div>
          <div class="nav-item" data-page="elastic"><span class="nav-icon">EL</span><span>弹性 inc_analysis</span></div>
          <div class="nav-item" data-page="shakedown"><span class="nav-icon">SD</span><span>Shakedown</span></div>
          <div class="nav-item locked" data-page="plastic"><span class="nav-icon">PL</span><span>弹塑性增量</span><span class="lock-mark">Locked</span></div>
          <div class="nav-item locked" data-page="direct-methods"><span class="nav-icon">DM</span><span>Direct Methods</span><span class="lock-mark">Locked</span></div>
          <div class="nav-item locked" data-page="validation"><span class="nav-icon">VA</span><span>ODB 验证</span><span class="lock-mark">Locked</span></div>
          <div class="nav-item locked" data-page="shell"><span class="nav-icon">SH</span><span>Shell 分析</span><span class="lock-mark">Locked</span></div>
          <div class="nav-item locked" data-page="topopt"><span class="nav-icon">TO</span><span>Topology Optimization</span><span class="lock-mark">Locked</span></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">可视化</div>
          <div class="nav-item" data-page="visualization"><span class="nav-icon">VZ</span><span>MAT 场变量可视化</span></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">工具</div>
          <div class="nav-item" data-page="tasks"><span class="nav-icon">TK</span><span>任务管理</span></div>
          <div class="nav-item" data-page="docs"><span class="nav-icon">DC</span><span>说明文件</span></div>
          <div class="nav-item" data-page="settings"><span class="nav-icon">ST</span><span>设置</span></div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-status">
          <span class="status-dot checking" id="wsl-dot"></span>
          <span id="wsl-text">检测中...</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div id="page-dashboard" class="page active"><div class="page-container"><div id="dashboard-content"></div></div></div>
      <div id="page-models" class="page"><div class="page-container"><div id="models-content"></div></div></div>
      <div id="page-elastic" class="page"><div class="page-container"><div id="elastic-content"></div></div></div>
      <div id="page-shakedown" class="page"><div class="page-container"><div id="shakedown-content"></div></div></div>
      <div id="page-visualization" class="page"><div class="page-container viz-page-container"><div id="viz-content"></div></div></div>
      <div id="page-tasks" class="page"><div class="page-container"><div id="tasks-content"></div></div></div>
      <div id="page-docs" class="page"><div class="page-container"><div id="docs-content"></div></div></div>
      <div id="page-settings" class="page"><div class="page-container"><div id="settings-content"></div></div></div>
      <div id="page-plastic" class="page"><div class="page-container"><div id="plastic-content"></div></div></div>
      <div id="page-direct-methods" class="page"><div class="page-container"><div id="direct-methods-content"></div></div></div>
      <div id="page-validation" class="page"><div class="page-container"><div id="validation-content"></div></div></div>
      <div id="page-shell" class="page"><div class="page-container"><div id="shell-content"></div></div></div>
      <div id="page-topopt" class="page"><div class="page-container"><div id="topopt-content"></div></div></div>
    </main>
  </div>

  <script src="/static/js/components.js?v=8"></script>
  <script src="/static/js/app.js?v=8"></script>
</body>
</html>
