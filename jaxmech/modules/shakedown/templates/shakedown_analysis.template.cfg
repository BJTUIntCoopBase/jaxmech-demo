# Solid shakedown demo template (MAT-first, CVXPY backend only).

mat_files = [
    "<WSL_PROJECT_ROOT>/Examples/PlateWithHole/inc_analysis/Load1Ela.mat",
    "<WSL_PROJECT_ROOT>/Examples/PlateWithHole/inc_analysis/Load2Ela.mat"
]

# Demo scope: solid lower-bound shakedown, C formulation, CVXPY/Clarabel.
formulation = C
solver = cvxpy

# R_ratios = sigma_E(min) / sigma_E(max) for each load case.
R_ratios = [0, 0, 0]

# yield_values belongs to shakedown only.
yield_values = {'MATERIAL-1': 280}

# Number of load-domain vertices: 1, 2, 4, or 8.
num_vert = 4

# Angle-defined load point for 2 or 3 load cases.
use_angles = yes
theta_deg = [0, 45, 90]
phi_deg = [0]

# If use_angles = no, provide explicit load factors. The first N columns are
# used, where N is the number of MAT files.
load_factor_set = [
    [1.0, 0.0, 0.0],
    [0.70710678, 0.70710678, 0.0]
]
