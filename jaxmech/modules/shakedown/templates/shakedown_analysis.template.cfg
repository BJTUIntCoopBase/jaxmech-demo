# 安定分析最小模板（MAT-first）
# 说明：
# 1. 模型入口只来自已经生成好的 JAX 弹性主 .mat 文件。
# 2. 最多支持 3 个载荷工况，因此 mat_files 最多写 3 个路径。
# 3. mat_files 的顺序固定对应 case 1 / case 2 / case 3。
# 4. 程序会根据第一个 .mat 自动识别 solid / shell，并结合下面的选项匹配内部求解器。

mat_files = [
    "<WSL_PROJECT_ROOT>/Examples/PlateWithHole/inc_analysis/Load1Ela.mat",
    "<WSL_PROJECT_ROOT>/Examples/PlateWithHole/inc_analysis/Load2Ela.mat"
]

# formulation:
#   C  = 直接以残余应力 rho 为变量
#   MN = 采用 legacy M/N 变量
formulation = C

# shell_yield:
#   Ilyushin = 广义应力/屈服面路线
#   layer    = layer stress 路线
# 对 solid 会自动忽略这个选项。
shell_yield = Ilyushin

# shell Ilyushin interaction parameter.
# 当前实现采用
#   phi = phi_N + phi_M + 2 c |phi_NM|
# 并等价写成两条分支约束：
#   ||a ± c b||^2 + (1-c^2)||b||^2 <= 1
# c ~= 1 接近 Old MATLAB 形式；c = 0.5 作为当前默认设置。
ilyushin_c = 0.5

# solver:
#   cvxpy  = WSL 侧 CVXPY/Clarabel
#   gurobi = Windows 侧 Gurobi
solver = cvxpy

# 只有 solver = gurobi 时才使用下面这些 backend 选项。
gurobi_backend = python
# windows_gurobi_root 建议填写 Gurobi 安装根目录。
# 例如 C:\gurobi952；程序内部会自动补成 C:\gurobi952\win64。
windows_gurobi_root = C:\gurobi952
windows_python_exe =
windows_matlab_exe = C:\Program Files\MATLAB\R2024b\bin\matlab.exe
windows_gurobi_user =
windows_gurobi_password =
wsl_python =

# Gurobi 额外参数示例。
# 用户可以继续补充更多键值。
gurobi_params = {'TimeLimit': 3600, 'FeasibilityTol': 1e-6}

# R_ratios = [R1, R2, R3]
# 定义：R_n = sigma^E(min) / sigma^E(max)
# 这里提供的弹性 .mat 默认对应 sigma^E(max) 顶点。
# 程序会根据 R_ratios 自动构造 min 顶点。
# 默认 [0,0,0] 表示没有反向加载，min 顶点退化为 0。
R_ratios = [0, 0, 0]

# yield_values 只属于安定分析，不属于通用弹性材料定义。
yield_values = {'MATERIAL-1': 280}

# 载荷域定义
# num_vert = 1:
#   只取 max 顶点，即 load_factor = [a1, a2, a3]
# num_vert = 2:
#   取 [max, min] 两个顶点，其中 min 由 R_ratios 自动生成
# num_vert = 4 / 8:
#   分别对应 2 载荷 / 3 载荷情况下的全部二进制角点组合
num_vert = 4

# use_angles = yes:
#   用角度定义唯一的 max 顶点 load_factor = [a1, a2, a3]
#   2 载荷时：a1 = cos(theta), a2 = sin(theta)
#   3 载荷时：a1 = cos(phi) * cos(theta), a2 = cos(phi) * sin(theta), a3 = sin(phi)
#   case 1 不参与角度分解，固定 a1 = 1
use_angles = yes
theta_deg = [0, 45, 90]
phi_deg = [0]

# use_angles = no:
#   直接使用下面的 load_factor_set 逐行做安定分析
#   每一行固定写 3 个数，分别对应 case1 / case2 / case3
#   如果实际只有 1 个或 2 个 .mat，程序会自动只取前 1 列或前 2 列
load_factor_set = [
    [1.0, 0.0, 0.0],
    [0.70710678, 0.70710678, 0.0]
]
