# validation 模板
# 如果某个目录名称中包含 validation，程序会优先读取该目录内的 cfg。
# 若该目录内没有 cfg，则自动使用默认逻辑：
# 1. 从同模型下的 inc_analysis 目录读取全部 .mat
# 2. 默认匹配模型根目录 abaqus/<case>.odb
# 3. 将 .mat 复制到当前 validation 目录后再写入 validation 结果

# validation 专属的 Windows ABAQUS 命令。
# 由于 ODB 提取只属于 validation，不再从 env.cfg 兜底读取。
windows_abaqus_cmd =

# 可选：显式指定待验证的弹性 .mat 文件
#
# mat_files = [
#     "/mnt/e/.../Examples/PlateWithHole2D/inc_analysis/Load1Ela.mat",
#     "/mnt/e/.../Examples/PlateWithHole2D/inc_analysis/Load2Ela.mat"
# ]

# 可选：显式指定对应的 ODB 文件
#
# odb_files = [
#     "/mnt/e/.../Examples/PlateWithHole2D/abaqus/Load1Ela.odb",
#     "/mnt/e/.../Examples/PlateWithHole2D/abaqus/Load2Ela.odb"
# ]

# 是否先复制源 .mat 到当前 validation 目录，再回写 validation 结果
copy_mat = 1
